name: Release

# Baut ein signiertes App Bundle (für den Play Store) und APK, sobald ein Tag wie v1.2.3 gepusht wird.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      - name: Version aus dem Tag ableiten
        id: version
        run: |
          name="${GITHUB_REF_NAME#v}"
          if [[ ! "$name" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            name="0.0.${GITHUB_RUN_NUMBER}"
          fi
          IFS=. read -r major minor patch <<< "$name"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=$((major * 10000 + minor * 100 + patch))" >> "$GITHUB_OUTPUT"

      - name: Upload-Keystore bereitstellen
        env:
          KEYSTORE_BASE64: ${{ secrets.STICKER_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret STICKER_KEYSTORE_BASE64 fehlt (siehe README)."; exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"

      - name: Testen und signiert bauen
        env:
          STICKER_KEYSTORE_PATH: ${{ runner.temp }}/upload.jks
          STICKER_KEYSTORE_PASSWORD: ${{ secrets.STICKER_KEYSTORE_PASSWORD }}
          STICKER_KEY_ALIAS: ${{ secrets.STICKER_KEY_ALIAS }}
          STICKER_KEY_PASSWORD: ${{ secrets.STICKER_KEY_PASSWORD }}
        run: >
          ./gradlew testDebugUnitTest bundleRelease assembleRelease --console=plain
          -PversionName=${{ steps.version.outputs.name }}
          -PversionCode=${{ steps.version.outputs.code }}

      - name: Keystore entfernen
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"

      - name: Dateien umbenennen
        run: |
          mkdir dist
          cp app/build/outputs/bundle/release/app-release.aab "dist/sticker-tracker-${{ steps.version.outputs.name }}.aab"
          cp app/build/outputs/apk/release/app-release.apk "dist/sticker-tracker-${{ steps.version.outputs.name }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: sticker-tracker-${{ steps.version.outputs.name }}
          path: dist/

      - name: GitHub-Release anlegen
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
